<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>
    <script src="../js/sessao.js"></script>
    <link rel="stylesheet" href="../css/favoritos.css">
</head>

<body onload="/*validarSessao();*/ carregarCarros()">
    <main class="page">
        <header class="topbar">
            <h1>Ola, <span id="b_usuario"></span>!</h1>
            <button class="btn-sair" onclick="limparSessao()">Sair</button>
        </header>

        <section class="content" id="conteudo">
            <article class="car-view" id="detalhe_carro">
                <div class="car-image-wrap">
                    <img id="imagem_carro" src="../assets/banner_fordgt.png" alt="Imagem do carro selecionado">
                </div>

                <div class="car-info">
                    <h2 id="titulo_modelo">Selecione um carro</h2>
                    <p id="texto_detalhes">Escolha um dos botoes ao lado para ver os detalhes.</p>
                    <button id="btn_favorito" class="btn-favorito" onclick="alternarFavoritoAtual()" disabled>
                        Favoritar
                    </button>
                </div>
            </article>

            <aside class="selector-card">
                <h3>Trocar visualizacao</h3>
                <div id="lista_botoes" class="selector-list"></div>
            </aside>
        </section>
    </main>
</body>

<script>
    const imagemPadrao = "../assets/banner_fordgt.png";
    const conteudo = document.getElementById("conteudo");
    const listaBotoes = document.getElementById("lista_botoes");
    const imagemCarro = document.getElementById("imagem_carro");
    const tituloModelo = document.getElementById("titulo_modelo");
    const textoDetalhes = document.getElementById("texto_detalhes");
    const btnFavorito = document.getElementById("btn_favorito");

    let carros = [];
    let indiceAtual = 0;

    function carregarCarros() {
        fetch(`/carros/listar/${sessionStorage.ID_USUARIO}`)
            .then(resposta => resposta.json())
            .then(listaCarros => {
                carros = listaCarros;

                if (!carros.length) {
                    conteudo.innerHTML = `<div class="estado-vazio">Nenhum carro encontrado para exibicao.</div>`;
                    return;
                }

                renderizarBotoesCarro();
                mostrarCarro(indiceAtual);
            })
            .catch(erro => console.log(erro));
    }

    function renderizarBotoesCarro() {
        listaBotoes.innerHTML = "";

        carros.forEach((carro, indice) => {
            listaBotoes.innerHTML += `
                <button class="btn-carro ${indice === indiceAtual ? "ativo" : ""}" onclick="selecionarCarro(${indice})">
                    ${carro.modelo}
                    <small>${carro.montadora} - ${carro.estilo}</small>
                </button>
            `;
        });
    }

    function selecionarCarro(indice) {
        indiceAtual = indice;
        mostrarCarro(indiceAtual);
        renderizarBotoesCarro();
    }

    function mostrarCarro(indice) {
        const carro = carros[indice];

        imagemCarro.src = `src/carros/${carro.nome}.png`;
        imagemCarro.alt = `Imagem de ${carro.modelo}`;
        tituloModelo.textContent = carro.modelo;
        textoDetalhes.textContent = `${carro.montadora} - ${carro.estilo}`;
        btnFavorito.disabled = false;
        btnFavorito.textContent = carro.favorito ? "Desfavoritar" : "Favoritar";
        btnFavorito.classList.toggle("favoritado", carro.favorito);
    }

    function alternarFavoritoAtual() {
        const carroAtual = carros[indiceAtual];
        let promessa;

        if (carroAtual.favorito) {
            promessa = fetch(`/favoritos/desfavoritar/${sessionStorage.ID_USUARIO}/${carroAtual.id}`, {
                method: "DELETE"
            });
        } else {
            promessa = fetch("/favoritos/favoritar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    idUsuarioServer: sessionStorage.ID_USUARIO,
                    idCarroServer: carroAtual.id
                })
            })
        }

        promessa
            .then(function (resposta) {
                if (!resposta.ok) {
                    resposta.text().then(texto => alert(`Erro ${resposta.status}: ${texto}`));
                } else {
                    carros[indiceAtual].favorito = !carroAtual.favorito;
                    mostrarCarro(indiceAtual);
                }
            })
            .catch(function (erro) {
                alert("Falha ao conectar com a API: " + erro);
            });
    }
</script>
</html>
