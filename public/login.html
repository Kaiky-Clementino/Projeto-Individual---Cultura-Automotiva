<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaTech | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/cadlog.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="container">

        <!-- Lado esquerdo: logo -->
        <div class="lado-esquerdo">
            <nav class="barra-navegacao container-principal">
                <div id="logo_nav"><img src="assets/logo_branco.png" id="logo"></div>
                <a href="index.html" class="item-menu">HOME</a>
                <a href="cadastro.html" class="botao-cadastro">CADASTRAR</a>
            </nav>
            <video autoplay muted loop playsinline id="background-video">
                <source src="assets/videos/login.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Lado direito: formulário -->


        <div class="lado-direito">
            <div class="formulario">
                <h1>Bem-vindo de Volta!</h1>
                <p>Realize seu login</p>

                <div class="campo">
                    <img src="assets/icons/mail.svg" alt="">
                    <input type="text" placeholder="seu@email.com" id="email_input">

                </div>
                <div id="div_msg_email" class="div_erros"></div>

                <div class="campo">
                    <img src="assets/icons/lock.svg" alt="">
                    <input type="password" placeholder="*******************" id="senha_input">
                </div>
                <div id="div_msg_senha" class="div_erros"></div>

                <button onclick="entrar()">Login</button>

                <a href="#" class="esqueceu">Esqueceu a senha?</a>
            </div>
        </div>

</body>

</html>

<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        div_msg_email.innerHTML = "";
        div_msg_senha.innerHTML = "";

        if (emailVar == "") {
            div_msg_email.innerHTML = "Preencha seu e-mail.";
        }

        if (senhaVar == "") {
            div_msg_senha.innerHTML = "Preencha sua senha.";
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    window.location = "./dashboard/favoritos.html";
                });
            } else {
                resposta.text().then(texto => {
                    div_msg_senha.innerHTML = texto;
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        });

        return false;
    }
</script>
