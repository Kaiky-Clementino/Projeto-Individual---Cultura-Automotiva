<script>
    function cadastrar() {
        var nomeVar = ipt_nome.value;
        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;
        var confirmacaoVar = ipt_confirmacao.value;

        div_msg_confirmacao.innerHTML = "";

        if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoVar == "") {
            div_msg_confirmacao.innerHTML = "Preencha todos os campos.";
            return false;
        }

        if (senhaVar != confirmacaoVar) {
            div_msg_confirmacao.innerHTML = "As senhas não conferem.";
            return false;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                div_msg_confirmacao.innerHTML = "Cadastro realizado! Redirecionando para o login...";
                setTimeout(function () {
                    window.location = "login.html";
                }, 2000);
            } else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        }).catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
            div_msg_confirmacao.innerHTML = "Não foi possível cadastrar. Tente novamente.";
        });

        return false;
    }
</script>
