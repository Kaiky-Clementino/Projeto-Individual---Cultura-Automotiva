<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AquaTech | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadLog.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->

  <div class="container">
    <!-- Lado direito: formulário -->
    <div class="lado-direito">
      <div class="formulario">
        <h1>OLÁ!</h1>
        <br>
        <p>Cadastre-se e,<br>comece agora mesmo nessa cultura!</p>

        <div class="campo">
          <input type="text" placeholder="Nome Completo" id="ipt_nome" class="inserts">
        </div>
        <div id="div_msg_nome" class="div_erros"></div>

        <div class="campo">
          <input type="text" placeholder="seu@email.com" id="ipt_email" class="inserts">
        </div>
        <div id="div_msg_email" class="div_erros"></div>

        <div class="campo">
          <input type="password" placeholder="Senha" id="ipt_senha" class="inserts">
        </div>
        <div id="div_msg_senha" class="div_erros"></div>

        <div class="campo">
          <input type="password" placeholder="Confirme a Senha" id="ipt_confirmacao" class="inserts">
        </div>
        <div id="div_msg_confirmacao" class="div_erros"></div>
        <div id="div_msg_log"></div>

        <button onclick="cadastrar()">Cadastrar</button>
      </div>
    </div>
    <div class="lado-esquerdo">
      <video autoplay muted loop playsinline id="background-video">
        <source src="assets/videos/cadastro.mp4" type="video/mp4">
      </video>
    </div>
</p>
  </div>
</body>

</html>

<script>
  function cadastrar() {
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var confirmacaoVar = ipt_confirmacao.value;

    div_msg_nome.innerHTML = "";
    div_msg_email.innerHTML = "";
    div_msg_senha.innerHTML = "";
    div_msg_confirmacao.innerHTML = "";

    if (nomeVar == "") {
      div_msg_nome.innerHTML = "Preencha seu nome";
      return false;
    }
    if (emailVar == "") {
      div_msg_email.innerHTML = "Preencha seu email";
      return false;
    }
    if (!emailVar.includes('@') || !emailVar.includes('.')) {
      div_msg_email.innerHTML = "Formato de email inválido";
      return false;
    }
    if (senhaVar == "") {
      div_msg_senha.innerHTML = "Preencha sua senha";
      return false;
    }
    if (senhaVar.length < 8) {
      div_msg_senha.innerHTML = "A senha deve ter no mínimo 8 dígitos";
      return false;
    }
    if (senhaVar.toUpperCase() == senhaVar) {
      div_msg_senha.innerHTML = "A senha deve ter no mínimo um caractere minúsculo";
      return false;
    }
    if (senhaVar.toLowerCase() == senhaVar) {
      div_msg_senha.innerHTML = "A senha deve ter no mínimo um caractere maiúsculo";
      return false;
    }
    if (senhaVar != confirmacaoVar) {
      div_msg_confirmacao.innerHTML = "As senhas não conferem";
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      })
    }).then(function (resposta) {
      if (resposta.ok) {
        div_msg_log.innerHTML = "Cadastro realizado! Redirecionando para o login...";
        setTimeout(function () {
          window.location = "login.html";
        }, 2000);
      } else {
        throw "Houve um erro ao tentar realizar o cadastro!";
      }
    }).catch(function (erro) {
      console.log(`#ERRO: ${erro}`);
      div_msg_log.innerHTML = `<p style="color: red;">Não foi possível cadastrar. Tente novamente.</p>`;
    });

    return false;
  }
</script>
